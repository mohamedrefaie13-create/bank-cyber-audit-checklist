  }).join("");
  return '<details class="'+cls+'" id="c-'+it.id+'"'+(OPEN[it.id]?" open":"")+' data-id="'+it.id+'">'+
    '<summary><span class="cid">'+it.id+'</span><div><div class="tl">'+esc(L(it.tldr))+'</div>'+
    '<div class="badges"><span class="badge b-'+it.risk+'">'+esc(t("risk"))+': '+esc(t(it.risk))+'</span>'+
    '<span class="badge b-urg">'+esc(t("urg"))+': '+esc(t(it.urg))+'</span>'+
    '<span class="badge b-own">'+esc(t("owner"))+': '+esc(L(it.owner))+'</span>'+
    '<span class="badge b-by">'+esc(t("by"))+': '+esc(memberName(it.by))+'</span></div></div>'+
    '<span class="st st-'+s+'">'+esc(t(s))+'</span></summary>'+
    '<div class="body">'+
    '<div class="lbl">'+esc(t("sect"))+'</div><div>'+esc(domName(it.d))+'</div>'+
    '<div class="lbl">'+esc(t("q"))+'</div><div class="q">'+esc(L(it.q))+'</div>'+
    '<div class="lbl">'+esc(t("acts"))+'</div><ul>'+acts+'</ul>'+
    '<div class="lbl">'+esc(t("just"))+'</div><div>'+esc(L(it.j))+'</div>'+
    '<div class="lbl">'+esc(t("stds"))+'</div><div class="chips">'+chips+'</div>'+
    '<div class="actions" role="group" aria-label="Status">'+
      '<button class="stbtn s-ok" data-set="ok:'+it.id+'" aria-pressed="'+(s==="ok")+'">✓ '+esc(t("markOk"))+'</button>'+
      '<button class="stbtn s-gap" data-set="gap:'+it.id+'" aria-pressed="'+(s==="gap")+'">✗ '+esc(t("markGap"))+'</button>'+
      '<button class="stbtn s-todo" data-set="todo:'+it.id+'" aria-pressed="'+(s==="todo")+'">'+esc(t("markTodo"))+'</button></div>'+
    '<textarea class="note" data-note="'+it.id+'" placeholder="'+esc(t("notes"))+'" aria-label="'+esc(t("notes"))+'">'+esc(n)+'</textarea>'+
    '</div></details>';
}

/* ---------- report ---------- */
function unresolved(){
  var gapsOnly=$("r-gaps").checked;
  return D.items.filter(function(it){ var s=st(it.id); return gapsOnly? s==="gap" : s!=="ok"; })
    .sort(function(a,b){ return score(b)-score(a) || RW[b.risk]-RW[a.risk] || (a.id<b.id?-1:1); });
}
function refStr(it){ return it.refs.map(function(r){return D.standards[r[0]].name+" "+r[1];}).join("; "); }
function paintReport(){
  var rows=unresolved();
  if(!rows.length){ $("rep-out").innerHTML='<div class="empty">'+esc(t("none"))+'</div>'; return; }
  var h='<table class="rep"><thead><tr><th>'+t("cRank")+'</th><th>'+t("cId")+'</th><th>'+t("cSc")+'</th><th>'+t("cRisk")+'</th><th>'+t("cOwn")+'</th><th>'+t("cAct")+'</th></tr></thead><tbody>';
  rows.forEach(function(it,i){
    var acts=(it.a[LANG]||it.a.en).slice(0,3).map(function(a){return "<li>"+esc(a)+"</li>";}).join("");
    var note=(STATE[it.id]&&STATE[it.id].n)?'<div style="margin-top:6px;color:var(--muted)">'+esc(STATE[it.id].n)+'</div>':"";
    h+='<tr><td class="rk">'+(i+1)+'</td><td><b>'+it.id+'</b> · '+esc(domName(it.d))+'<div>'+esc(L(it.tldr))+'</div>'+
      '<div style="margin-top:4px;direction:ltr;text-align:start;unicode-bidi:isolate;font-size:12.5px;color:var(--muted)">'+esc(refStr(it))+'</div>'+note+'</td>'+
      '<td class="rk">'+score(it)+'</td>'+
      '<td><span class="badge b-'+it.risk+'">'+esc(t(it.risk))+'</span> <span class="badge b-urg">'+esc(t(it.urg+"s"))+'</span><div style="margin-top:4px;font-size:12.5px;color:var(--muted)">'+(st(it.id)==="gap"?esc(t("gap")):esc(t("todo")))+'</div></td>'+
      '<td>'+esc(L(it.owner))+'<div style="margin-top:4px;font-size:12.5px;color:var(--muted)">'+esc(t("by"))+': '+esc(memberName(it.by))+'</div></td><td><ul>'+acts+'</ul></td></tr>';
  });
  $("rep-out").innerHTML=h+'</tbody></table>';
}
function reportText(csv){
  var rows=unresolved();
  if(csv){
    var q=function(s){return '"'+String(s).replace(/"/g,'""')+'"';};
    var lines=[["Rank","ID","Domain","Score","Risk","Urgency","Status","Owner","Summary","Action items","Standards","Prepared by","Notes"].map(q).join(",")];
    rows.forEach(function(it,i){
      lines.push([i+1,it.id,domName(it.d),score(it),it.risk,it.urg,st(it.id),it.owner.en,it.tldr.en,it.a.en.join(" | "),refStr(it),memberName(it.by),(STATE[it.id]&&STATE[it.id].n)||""].map(q).join(","));
    });
    return lines.join("\n");
  }
  var out=[t("repH")+" — "+L(D.client),""];
  rows.forEach(function(it,i){
    out.push((i+1)+". ["+it.id+"] "+L(it.tldr));
    out.push("   "+t("risk")+": "+t(it.risk)+" | "+t("urg")+": "+t(it.urg)+" | "+t("owner")+": "+L(it.owner)+" | "+t("by")+": "+memberName(it.by));
    (it.a[LANG]||it.a.en).forEach(function(a){ out.push("   - "+a); });
    out.push("   "+refStr(it)); out.push("");
  });
  return out.join("\n");
}
function copyText(txt){
  var done=function(){ $("copied").textContent=t("copied"); setTimeout(function(){$("copied").textContent="";},2200); };
  try{ navigator.clipboard.writeText(txt).then(done,fallback); }catch(e){ fallback(); }
  function fallback(){
    var ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){} document.body.removeChild(ta);
  }
}

/* ---------- about ---------- */
function paintAbout(){
  var ids=Object.keys(D.standards);
  var rows=ids.map(function(k){ var s=D.standards[k];
    var cnt=0; D.items.forEach(function(it){ it.refs.forEach(function(r){ if(r[0]===k) cnt++; }); });
    return '<tr><td style="direction:ltr;text-align:start"><b>'+esc(s.name)+'</b></td><td>'+cnt+'</td><td style="direction:ltr;text-align:start">'+(s.url?'<a href="'+esc(s.url)+'" target="_blank" rel="noopener noreferrer">'+esc(s.url)+'</a>':'—')+'</td><td style="direction:ltr;text-align:start;font-size:13px">'+esc(s.note)+'</td></tr>';
  }).join("");
  var intro = LANG==="ar"
    ? '<h2 style="margin:22px 0 6px;font-size:20px">حول القائمة</h2><p>تضم القائمة '+D.items.length+' بندًا في '+D.domains.length+' مجالات وظيفية، وكل بند يحتوي على: المجال، المعيار والضابط، سؤال التدقيق، الإجراءات المرتبطة، الخطورة، الاستعجال، والتبرير، إضافة إلى المسؤول المقترح. اضغط على أي معيار داخل البند لعرض شرح مختصر ورابط المصدر الرسمي.</p><p>ملاحظة: أرقام الضوابط وأسماء المعايير مكتوبة بالإنجليزية كما في المصادر الأصلية.</p>'
    : '<h2 style="margin:22px 0 6px;font-size:20px">About this checklist</h2><p>'+D.items.length+' items across '+D.domains.length+' functional domains. Each item has a section, standard &amp; control, audit question, associated action items, risk, urgency and justification, plus a suggested responsible owner. Click any standard chip inside an item for a short explanation and the official source link.</p><p>Control numbers are cited in their original form; the explanations are short paraphrases for navigation, not quotations.</p>';
  var howh='<h3 style="margin:22px 0 6px;font-size:17px">'+esc(t("howH"))+'</h3><ol class="howto">'+T[LANG].how.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
  var teamh='<h3 style="margin:22px 0 6px;font-size:17px">'+esc(t("team"))+'</h3><ul>'+D.team.map(function(m){var n=D.items.filter(function(it){return it.by===m.k;}).length; return '<li>'+esc(m.name)+' <span dir="ltr">('+esc(m.sid)+')</span> — '+n+'</li>';}).join('')+'</ul>';
  $("v-about").innerHTML=intro+howh+teamh+'<table class="rep"><thead><tr><th>'+(LANG==="ar"?"المعيار":"Standard")+'</th><th>'+(LANG==="ar"?"عدد الإشارات":"Citations")+'</th><th>'+(LANG==="ar"?"المصدر الرسمي":"Official source")+'</th><th>'+(LANG==="ar"?"ملاحظة":"Note")+'</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

/* ---------- modal & tooltip ---------- */
function openRef(key){
  var p=key.split(":"), it=itemById(p[0]), r=it.refs[+p[1]], s=D.standards[r[0]];
  var link = s.url ? '<a href="'+esc(s.url)+'" target="_blank" rel="noopener noreferrer">'+esc(t("viewSrc"))+' ↗</a>' : '<div class="warn">'+esc(t("nolink"))+'</div>';
  $("modal-in").innerHTML='<h3 id="m-title" style="direction:ltr;text-align:start">'+esc(s.name)+'</h3>'+
    '<div class="ctl">'+esc(t("ctrl"))+': '+esc(r[1])+'</div>'+
    '<div class="lbl" style="margin-top:6px">'+esc(t("reqLbl"))+'</div><div class="req">'+esc(r[2])+'</div>'+
    '<div class="nt" style="direction:ltr;text-align:start">'+esc(s.note)+'</div>'+
    '<div class="warn">'+esc(t("verify"))+'</div>'+
    '<div style="margin-top:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap">'+link+'<button class="btn" id="m-close">'+esc(t("close"))+'</button></div>';
  $("modal").classList.add("open"); $("m-close").focus();
}
function closeModal(){ $("modal").classList.remove("open"); }
var tip=$("tip");
function showTip(el,x,y){
  var p=el.getAttribute("data-ref").split(":"), r=itemById(p[0]).refs[+p[1]];
  tip.textContent=r[2]; tip.style.display="block";
  var w=tip.offsetWidth, h=tip.offsetHeight;
  var left=Math.min(Math.max(8,x-w/2),window.innerWidth-w-8), top=y-h-12; if(top<8) top=y+22;
  tip.style.left=left+"px"; tip.style.top=top+"px";
}

/* ---------- events ---------- */
function switchView(v){
  VIEW=v;
  ["list","rep","about"].forEach(function(k){
    $("v-"+k).classList.toggle("hide",k!==v);
    $("tab-"+k).setAttribute("aria-selected",k===v);
  });
  if(v==="rep") paintReport(); if(v==="about") paintAbout();
  window.scrollTo({top:0});
}
function renderAll(){ paintChrome(); paintProgress(); paintList(); if(VIEW==="rep") paintReport(); if(VIEW==="about") paintAbout(); }

$("l-en").onclick=function(){ LANG="en"; persist(); renderAll(); };
$("l-ar").onclick=function(){ LANG="ar"; persist(); renderAll(); };
$("tab-list").onclick=function(){ switchView("list"); };
$("tab-rep").onclick=function(){ switchView("rep"); };
$("tab-about").onclick=function(){ switchView("about"); };
["f-q","f-d","f-r","f-s","f-b","f-hide"].forEach(function(id){ $(id).addEventListener(id==="f-q"?"input":"change",paintList); });
$("r-gaps").addEventListener("change",paintReport);
$("b-copy").onclick=function(){ copyText(reportText(false)); };
$("b-csv").onclick=function(){ copyText(reportText(true)); };
$("b-print").onclick=function(){ try{ window.print(); }catch(e){} };
$("b-reset").onclick=function(){ if(window.confirm(t("resetQ"))){ Object.keys(STATE).forEach(function(k){delete STATE[k];}); persist(); OPEN={}; renderAll(); } };

document.addEventListener("click",function(e){
  var chip=e.target.closest&&e.target.closest(".chip");
  if(chip){ e.preventDefault(); e.stopPropagation(); tip.style.display="none"; openRef(chip.getAttribute("data-ref")); return; }
  var b=e.target.closest&&e.target.closest("[data-set]");
  if(b){
    var p=b.getAttribute("data-set").split(":"), s=p[0], id=p[1];
    STATE[id]=STATE[id]||{}; STATE[id].s=s; persist();
    var keepOpen = !($("f-hide").checked && s==="ok");
    OPEN[id]=keepOpen; paintProgress(); paintList(); return;
  }
  if(e.target===$("modal")) closeModal();
  if(e.target.id==="m-close") closeModal();
});
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeModal(); });
document.addEventListener("input",function(e){
  var id=e.target.getAttribute&&e.target.getAttribute("data-note");
  if(id){ STATE[id]=STATE[id]||{s:"todo"}; STATE[id].n=e.target.value; persist(); }
});
document.addEventListener("toggle",function(e){ var d=e.target; if(d.tagName==="DETAILS"&&d.dataset.id) OPEN[d.dataset.id]=d.open; },true);
document.addEventListener("mouseover",function(e){ var c=e.target.closest&&e.target.closest(".chip"); if(c){ var r=c.getBoundingClientRect(); showTip(c,r.left+r.width/2,r.top); } });
document.addEventListener("mouseout",function(e){ var c=e.target.closest&&e.target.closest(".chip"); if(c) tip.style.display="none"; });
document.addEventListener("focusin",function(e){ var c=e.target.closest&&e.target.closest(".chip"); if(c){ var r=c.getBoundingClientRect(); showTip(c,r.left+r.width/2,r.top); } });
document.addEventListener("focusout",function(){ tip.style.display="none"; });

renderAll();
// expose for tests
window.__audit={D:D,STATE:STATE,unresolved:unresolved,reportText:reportText};
})();
</script>
</body>
</html>
